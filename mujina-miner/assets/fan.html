<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUJINA // FAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#00f0ff; --mag:#ff2e97; --amber:#ffb000; --green:#1bff9c; --red:#ff3860; --bg:#05060c; --panel:#0a0f1c; --panel2:#0d1424; --line:#14243a; --dim:#4a6a86; --ink:#d6f7ff; }
  * { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Share Tech Mono', ui-monospace, monospace; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; margin: 0; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; }
  h1 .chev { color: var(--cyan); }
  .top { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .menubar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .menubar .menubtn { background:#0a1120; border:1px solid var(--line); color:var(--cyan); font-family:'Orbitron',sans-serif; font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:9px 14px; border-radius:4px; text-decoration:none; display:inline-flex; align-items:center; }
  .menubar .menubtn.on { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.3); }
  .sec { font-family:'Orbitron',sans-serif; font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:28px 0 12px; display:flex; align-items:center; gap:10px; }
  .sec::after { content:''; flex:1; height:1px; background:var(--line); }
  .sec-sub { font-family:'Share Tech Mono',monospace; text-transform:none; letter-spacing:0; font-size:11px; color:var(--dim); flex:none; }
  .card { background:var(--panel); border:1px solid var(--line); padding:18px; }
  .row { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .row label { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .row label small { text-transform:none; letter-spacing:0; }
  .row input, .row select { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:10px 12px; font:inherit; font-size:13px; }
  .btn { background:var(--panel2); border:1px solid var(--line); color:var(--ink); padding:11px 18px; font-family:'Orbitron',sans-serif; font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; border-radius:4px; }
  .btn.pri { border-color:var(--cyan); color:var(--cyan); }
  .msg { margin-top:12px; font-size:12px; color:var(--dim); }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  .note { font-size:12px; color:var(--dim); line-height:1.5; margin:0 0 12px; }
  .status-strip { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; }
  .dot.ok { background:var(--green); } .dot.bad { background:var(--red); }
  body.theme-minimal { --cyan:#0066cc; --bg:#eef2fa; --panel:rgba(255,255,255,.7); --panel2:rgba(255,255,255,.5); --line:rgba(0,0,0,.12); --dim:#6b7a90; --ink:#2d3e50; background:#eef2fa; color:#2d3e50; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body.theme-parasite { --cyan:#fff; --bg:#000; --panel:#000; --panel2:#111; --line:#fff; --dim:#aaa; --ink:#fff; background:#000; color:#fff; }
  body.theme-parasite * { font-family:"Courier New",Courier,monospace !important; text-shadow:none !important; box-shadow:none !important; }
</style>
<script src="/auth.js"></script>
</head>
<body>
<script>(function(){var t='cyberpunk';try{t=localStorage.getItem('mujina-theme')||t;}catch(e){}if(t==='apple')t='minimal';if(['cyberpunk','minimal','parasite'].indexOf(t)<0)t='cyberpunk';document.body.className='theme-'+t;})();</script>
<div class="wrap">
  <div class="top">
    <h1><span class="chev">//</span>MUJINA <span style="color:var(--dim);font-weight:400">/ FAN</span></h1>
    <div class="status-strip"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></div>
  </div>
  <nav class="menubar" aria-label="Main Menu">
    <a class="menubtn" href="/dashboard">Dashboard</a>
    <a class="menubtn" href="/power">Power</a>
    <a class="menubtn" href="/tuning">Tuning</a>
    <a class="menubtn on" href="/fan">Fan</a>
    <a class="menubtn" href="/fan#curve">Fan Curve</a>
    <a class="menubtn" href="/pool">Pool</a>
    <a class="menubtn" href="/led">LED</a>
    <a class="menubtn" href="/firmware">Firmware</a>
    <a class="menubtn" href="/display">Display</a>
    <a class="menubtn" href="/info">Info</a>
  </nav>

  <div id="fanSection" hidden>
    <div class="sec">Fan Control<span class="sec-sub" id="fanNote"></span></div>
    <div class="card">
      <div class="row" id="fanBoardRow" hidden>
        <label for="fanBoard">Board</label>
        <select id="fanBoard" autocomplete="off"></select>
      </div>
      <div class="row">
        <label for="fanMode">Mode</label>
        <select id="fanMode" autocomplete="off">
          <option value="auto" selected>Auto (curve + chip-limit escalation)</option>
          <option value="manual">Manual</option>
        </select>
      </div>
      <div class="row" id="fanManualRow" hidden>
        <label for="fanDuty">Fan Duty <small>% (0-100, no floor)</small></label>
        <input type="number" id="fanDuty" name="fan_duty_percent" min="0" max="100" step="1" value="50" autocomplete="off">
      </div>
      <button class="btn pri" id="fanApply" type="button">Apply</button>
      <div class="msg" id="fanMsg"></div>
    </div>
  </div>
  <div class="note" id="fanNone" hidden>No fan control for this board.</div>

  <div id="curve">
    <div id="curveSection" hidden>
      <div class="sec">Fan Curve<span class="sec-sub">Outlet-temp → duty% baseline, used in Auto mode — saved immediately, applied within ~1s</span></div>
      <div class="card">
        <svg id="curvePreview" viewBox="0 0 300 120" style="width:100%;height:120px;display:block;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px">
          <g id="curveGrid" stroke="var(--line)" stroke-width="1"></g>
          <polyline id="curveLine" fill="none" stroke="var(--cyan)" stroke-width="2"></polyline>
          <g id="curveDots" fill="var(--cyan)"></g>
        </svg>
        <div id="curvePoints"></div>
        <div style="display:flex;gap:10px;justify-content:space-between;margin-top:10px">
          <button class="btn" id="curveAddPoint" type="button">+ Add Point</button>
          <button class="btn pri" id="curveApply" type="button">Save Curve</button>
        </div>
        <div class="msg" id="curveMsg"></div>
      </div>
    </div>
  </div>
</div>
<script>
function $(id) { return document.getElementById(id); }
function show(id, on) { const el = $(id); if (el) el.hidden = !on; }
function say(id, text, ok) { const m = $(id); if (!m) return; m.textContent = text; m.className = ok === true ? 'msg ok' : ok === false ? 'msg err' : 'msg'; }
let BOARDS = [], NAME = null, KIND = 'none', HAS_CURVE = false, POINTS = [], WRITE_UNTIL = 0;
function lock() { WRITE_UNTIL = Date.now() + 6000; ['fanApply','curveApply','curveAddPoint'].forEach(id => { const b = $(id); if (b) b.disabled = true; }); setTimeout(() => ['fanApply','curveApply','curveAddPoint'].forEach(id => { const b = $(id); if (b) b.disabled = false; }), 6000); }
function busy(id) { if (Date.now() < WRITE_UNTIL) { say(id, 'wait a few seconds between commands', false); return true; } return false; }
async function send(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status + (await r.text().then(t => t ? ': ' + t.slice(0, 160) : '').catch(() => '')));
  return r;
}
function syncFanMode() { show('fanManualRow', $('fanMode').value === 'manual'); }
function applyCaps() {
  const b = BOARDS.find(x => x.name === NAME);
  const caps = (b && b.caps) || {};
  KIND = caps.fan || 'none';
  HAS_CURVE = !!caps.fan_curve;
  const fanOn = KIND && KIND !== 'none';
  show('fanSection', fanOn);
  show('fanNone', !fanOn);
  $('fanNote').textContent = KIND === 'harness'
    ? 'Controlled by the device harness: Auto follows the fan curve (and escalates to 100% if a chip runs too hot); Manual holds a fixed duty.'
    : 'Board fan: Auto lets the board regulate temperature; Manual holds a fixed duty.';
  show('curveSection', HAS_CURVE);
  const sel = $('fanBoard');
  show('fanBoardRow', BOARDS.length > 1);
  sel.textContent = '';
  BOARDS.forEach(board => {
    const o = document.createElement('option');
    o.value = board.name; o.textContent = board.name;
    if (board.name === NAME) o.selected = true;
    sel.appendChild(o);
  });
}
async function applyFan() {
  if (!NAME || !KIND || KIND === 'none') { say('fanMsg', 'no fan control for this board', false); return; }
  if (busy('fanMsg')) return;
  const mode = $('fanMode').value;
  const duty = +$('fanDuty').value;
  if (mode === 'manual' && (!isFinite(duty) || duty < 0 || duty > 100)) { say('fanMsg', 'duty must be 0–100%', false); return; }
  const body = KIND === 'board'
    ? (mode === 'manual' ? { auto: false, percent: duty } : { auto: true })
    : (mode === 'manual' ? { mode, manual_duty_percent: duty } : { mode });
  say('fanMsg', 'applying…');
  lock();
  try {
    await send('PATCH', '/api/v0/boards/' + encodeURIComponent(NAME) + '/fan', body);
    say('fanMsg', mode === 'manual' ? 'applied: manual duty ' + duty + '% ✓' : 'applied: auto ✓', true);
  } catch (e) { say('fanMsg', 'fan command failed (' + e.message + ')', false); }
}
function drawCurve() {
  const W = 300, H = 120, PAD = 8;
  const pts = POINTS.slice().sort((a, b) => a.temp_c - b.temp_c);
  const grid = $('curveGrid');
  grid.innerHTML = '';
  for (let i = 1; i < 4; i++) {
    const y = PAD + (H - 2 * PAD) * i / 4;
    grid.innerHTML += '<line x1="' + PAD + '" y1="' + y + '" x2="' + (W - PAD) + '" y2="' + y + '" />';
  }
  if (!pts.length) { $('curveLine').setAttribute('points', ''); $('curveDots').innerHTML = ''; return; }
  const tMin = Math.min(...pts.map(p => p.temp_c)), tMax = Math.max(...pts.map(p => p.temp_c), tMin + 1);
  const x = t => PAD + (W - 2 * PAD) * (t - tMin) / (tMax - tMin);
  const y = d => H - PAD - (H - 2 * PAD) * (d / 100);
  $('curveLine').setAttribute('points', pts.map(p => x(p.temp_c).toFixed(1) + ',' + y(p.duty_pct).toFixed(1)).join(' '));
  $('curveDots').innerHTML = pts.map(p => '<circle cx="' + x(p.temp_c).toFixed(1) + '" cy="' + y(p.duty_pct).toFixed(1) + '" r="3.5"></circle>').join('');
}
function renderRows() {
  const wrap = $('curvePoints');
  wrap.textContent = '';
  POINTS.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.cssText = 'display:flex;gap:10px;align-items:flex-end;margin-bottom:8px';
    const cell = (label, min, max, step, val) => {
      const c = document.createElement('div'); c.style.flex = '1';
      const l = document.createElement('label'); l.textContent = label;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.autocomplete = 'off'; inp.min = min; inp.max = max; inp.step = step; inp.value = val; inp.style.width = '100%';
      c.append(l, inp);
      return [c, inp];
    };
    const [c1, tIn] = cell('Outlet °C', 0, 150, 0.5, p.temp_c);
    const [c2, dIn] = cell('Duty %', 0, 100, 1, p.duty_pct);
    tIn.addEventListener('input', () => { POINTS[i].temp_c = +tIn.value; drawCurve(); });
    dIn.addEventListener('input', () => { POINTS[i].duty_pct = +dIn.value; drawCurve(); });
    const rm = document.createElement('button');
    rm.className = 'btn'; rm.type = 'button'; rm.textContent = '×';
    rm.addEventListener('click', () => {
      if (POINTS.length <= 2) { say('curveMsg', 'need at least 2 points', false); return; }
      POINTS.splice(i, 1); renderRows(); drawCurve();
    });
    row.append(c1, c2, rm);
    wrap.appendChild(row);
  });
}
async function loadCurve() {
  if (!NAME || !HAS_CURVE) return;
  try {
    const r = await fetch('/api/v0/boards/' + encodeURIComponent(NAME) + '/fan-curve');
    if (!r.ok) return;
    const d = await r.json();
    if (d.points && d.points.length) { POINTS = d.points; renderRows(); drawCurve(); }
  } catch (e) {}
}
function addPoint() {
  if (POINTS.length >= 8) { say('curveMsg', 'max 8 points', false); return; }
  const last = POINTS[POINTS.length - 1] || { temp_c: 40, duty_pct: 30 };
  POINTS.push({ temp_c: last.temp_c + 5, duty_pct: Math.min(100, last.duty_pct + 15) });
  renderRows(); drawCurve();
}
async function applyCurve() {
  if (!NAME || !HAS_CURVE) { say('curveMsg', 'no fan curve for this board', false); return; }
  if (POINTS.length < 2) { say('curveMsg', 'need at least 2 points', false); return; }
  if (busy('curveMsg')) return;
  say('curveMsg', 'saving…');
  lock();
  try {
    const r = await send('PATCH', '/api/v0/boards/' + encodeURIComponent(NAME) + '/fan-curve', { points: POINTS });
    const d = await r.json();
    if (d.points) POINTS = d.points;
    renderRows(); drawCurve();
    say('curveMsg', 'saved ✓ (' + POINTS.length + ' points)', true);
  } catch (e) { say('curveMsg', 'save failed (' + e.message + ')', false); }
}
async function boot() {
  try {
    const r = await fetch('/api/v0/system');
    if (r.ok) {
      const sys = await r.json();
      BOARDS = sys.boards || [];
      NAME = (BOARDS[0] && BOARDS[0].name) || 'nano3s-0';
      $('connDot').className = 'dot ok'; $('connText').textContent = 'live';
    }
  } catch (e) { $('connDot').className = 'dot bad'; $('connText').textContent = 'offline'; }
  applyCaps();
  loadCurve();
  if (location.hash === '#curve') {
    const el = $('curve');
    if (el) el.scrollIntoView();
  }
}
$('fanMode').addEventListener('change', syncFanMode);
$('fanApply').addEventListener('click', applyFan);
$('curveAddPoint').addEventListener('click', addPoint);
$('curveApply').addEventListener('click', applyCurve);
$('fanBoard').addEventListener('change', () => { NAME = $('fanBoard').value; applyCaps(); loadCurve(); });
boot();
</script>
</body>
</html>
